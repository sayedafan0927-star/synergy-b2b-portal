name: Enterprise Resilience, Security & Build CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-and-resilience:
    name: Security & Resilience Invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run 27-Point Enterprise Verification Suite
        run: |
          python3 scripts/test_resilience_and_security.py

  build-and-typecheck:
    name: TypeScript & Vite Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Verify TypeScript Types
        run: npm run typecheck

      - name: Build Production Assets
        run: npm run build
